name: CI
on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Tools
        uses: jdx/mise-action@v4

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Formatting
        run: mise run fmt

      - name: Vet
        run: mise run vet

      - name: Lint
        run: mise run lint

      - name: Cache testcontainer images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('.github/testcontainer-images.txt') }}

      - name: Test
        run: mise run test
