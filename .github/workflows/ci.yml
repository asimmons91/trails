name: CI
on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Tools
        uses: jdx/mise-action@v4

      - name: Formatting
        run: mise run fmt

      - name: Vet
        run: mise run vet

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test
