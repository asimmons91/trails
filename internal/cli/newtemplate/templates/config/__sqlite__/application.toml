[views]
layout = "application"

[server]
host = "127.0.0.1"
port = 3000

[database]
path = "db/app.db"
pragma = [
  "journal_mode(WAL)",
  "busy_timeout(5000)",
  "synchronous(NORMAL)",
  "cache_size(-64000)",
  "foreign_keys(1)",
  "auto_vacuum(FULL)",
]

[mailer]
delivery = "log"
from = "from@example.com"

[cache]
store = "memory"
ttl = "5m"
