# git-cliff configuration for the trails release pipeline.
# https://git-cliff.org/docs/configuration
#
# All 5 modules in this repo (root + pack/driver/{mysql,postgres,sqlite} +
# jobs/backend/cloudtask) are released in lockstep under one version, tagged
# as `vX.Y.Z` at the root and `<module-path>/vX.Y.Z` for each submodule.
# tag_pattern below restricts git-cliff to the root-style tags so it never
# confuses a path-prefixed submodule tag for a release tag.

[bump]
initial_tag = "v0.1.0"

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Chores" },
  { body = ".*BREAKING CHANGE", group = "Breaking Changes" },
  { message = ".*", group = "Other" },
]

[changelog]
header = "# Changelog\n"
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true
